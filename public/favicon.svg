<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tsubaki-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="tsubaki-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <radialGradient id="tsubaki-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F2433" />
      <stop offset="100%" stop-color="#0B0D12" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base badge -->
  <rect width="64" height="64" rx="16" fill="url(#tsubaki-bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#E11D48" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Camellia outer petals -->
  <g filter="url(#glow)">
    <!-- Top Petal -->
    <path d="M32 14 C26 14 22 18 24 24 C27 28 32 30 32 32 C32 30 37 28 40 24 C42 18 38 14 32 14 Z" fill="url(#tsubaki-petal)" />
    <!-- Top-Right Petal -->
    <path d="M47 21 C43 17 38 18 35 23 C33 27 34 31 32 32 C34 31 39 33 43 30 C49 26 50 21 47 21 Z" fill="url(#tsubaki-petal)" opacity="0.95" />
    <!-- Bottom-Right Petal -->
    <path d="M46 41 C48 35 44 32 38 31 C34 31 33 32 32 32 C33 32 34 37 38 41 C43 45 48 44 46 41 Z" fill="url(#tsubaki-petal)" />
    <!-- Bottom Petal -->
    <path d="M32 50 C38 50 42 46 40 40 C37 36 32 34 32 32 C32 34 27 36 24 40 C22 46 26 50 32 50 Z" fill="url(#tsubaki-petal)" />
    <!-- Bottom-Left Petal -->
    <path d="M18 43 C20 47 25 46 29 42 C32 38 32 33 32 32 C32 33 27 33 23 37 C18 40 17 43 18 43 Z" fill="url(#tsubaki-petal)" opacity="0.95" />
    <!-- Top-Left Petal -->
    <path d="M17 21 C14 26 17 31 22 31 C26 31 30 31 32 32 C30 31 29 26 26 22 C22 17 18 17 17 21 Z" fill="url(#tsubaki-petal)" />
  </g>

  <!-- Camellia inner petals -->
  <circle cx="32" cy="32" r="9" fill="#BE123C" />
  <circle cx="32" cy="32" r="7" fill="#E11D48" />

  <!-- Camellia golden core / stamens -->
  <circle cx="32" cy="32" r="4" fill="url(#tsubaki-core)" />
  <circle cx="30" cy="30.5" r="1" fill="#FEF08A" />
  <circle cx="34" cy="31" r="0.9" fill="#FEF08A" />
  <circle cx="32" cy="33.5" r="0.9" fill="#FEF08A" />
  <circle cx="30.5" cy="33" r="0.8" fill="#FEF08A" />
  <circle cx="33.5" cy="29.5" r="0.8" fill="#FEF08A" />
</svg>
